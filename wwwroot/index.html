            // @ts-nocheck
            function descargarArchivo(nombreArchivo, tipoContenido, contenidoBase64) {
                const link = document.createElement('a');
                link.download = nombreArchivo;
                link.href = "data:" + tipoContenido + ";base64," + contenidoBase64;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
    </script>
